<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TimeTracker Pro API 測試</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
        background-color: #f5f5f5;
      }
      .container {
        background: white;
        border-radius: 12px;
        padding: 30px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      h1 {
        color: #2563eb;
        margin-bottom: 30px;
        text-align: center;
      }
      .test-section {
        margin-bottom: 30px;
        padding: 20px;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
      }
      .test-section h3 {
        color: #374151;
        margin-top: 0;
      }
      button {
        background-color: #2563eb;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 6px;
        cursor: pointer;
        margin-right: 10px;
        margin-bottom: 10px;
      }
      button:hover {
        background-color: #1d4ed8;
      }
      .result {
        margin-top: 15px;
        padding: 15px;
        background-color: #f9fafb;
        border-radius: 6px;
        border-left: 4px solid #2563eb;
      }
      .success {
        border-left-color: #10b981;
        background-color: #f0fdf4;
      }
      .error {
        border-left-color: #ef4444;
        background-color: #fef2f2;
      }
      pre {
        background-color: #1f2937;
        color: #f9fafb;
        padding: 15px;
        border-radius: 6px;
        overflow-x: auto;
        font-size: 14px;
      }
      .status {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: bold;
        margin-left: 10px;
      }
      .status.online {
        background-color: #10b981;
        color: white;
      }
      .status.offline {
        background-color: #ef4444;
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🚀 TimeTracker Pro API 測試工具</h1>

      <div class="test-section">
        <h3>📡 服務器狀態檢查</h3>
        <button onclick="checkServerStatus()">檢查後端服務器</button>
        <span id="serverStatus" class="status">未知</span>
        <div id="serverResult" class="result" style="display: none"></div>
      </div>

      <div class="test-section">
        <h3>🔐 認證系統測試</h3>
        <button onclick="testLogin()">測試登入 (demo@timetracker.pro)</button>
        <button onclick="testRegister()">測試註冊</button>
        <button onclick="testLogout()">測試登出</button>
        <div id="authResult" class="result" style="display: none"></div>
      </div>

      <div class="test-section">
        <h3>👤 用戶管理測試</h3>
        <button onclick="testGetUserProfile()">獲取用戶資料</button>
        <button onclick="testUpdateUserProfile()">更新用戶資料</button>
        <div id="userResult" class="result" style="display: none"></div>
      </div>

      <div class="test-section">
        <h3>📊 專案管理測試</h3>
        <button onclick="testGetProjects()">獲取專案列表</button>
        <button onclick="testCreateProject()">建立測試專案</button>
        <div id="projectResult" class="result" style="display: none"></div>
      </div>

      <div class="test-section">
        <h3>⏱️ 時間追蹤測試</h3>
        <button onclick="testTimeEntries()">獲取時間記錄</button>
        <button onclick="testCreateTimeEntry()">建立時間記錄</button>
        <div id="timeResult" class="result" style="display: none"></div>
      </div>

      <div class="test-section">
        <h3>🔗 完整流程測試</h3>
        <button onclick="runFullTest()" style="background-color: #10b981">
          執行完整測試流程
        </button>
        <div id="fullTestResult" class="result" style="display: none"></div>
      </div>
    </div>

    <script>
      const API_BASE_URL = "http://localhost:5000/api";
      let currentToken = null;

      function showResult(elementId, content, isSuccess = true) {
        const element = document.getElementById(elementId);
        element.innerHTML = content;
        element.className = `result ${isSuccess ? "success" : "error"}`;
        element.style.display = "block";
      }

      async function checkServerStatus() {
        try {
          const response = await fetch(`${API_BASE_URL}/health`);
          const data = await response.json();

          const statusElement = document.getElementById("serverStatus");
          if (response.ok) {
            statusElement.textContent = "在線";
            statusElement.className = "status online";
            showResult(
              "serverResult",
              `
                        <h4>✅ 後端服務器正常運行</h4>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `
            );
          } else {
            throw new Error("服務器回應異常");
          }
        } catch (error) {
          const statusElement = document.getElementById("serverStatus");
          statusElement.textContent = "離線";
          statusElement.className = "status offline";
          showResult(
            "serverResult",
            `
                    <h4>❌ 後端服務器連接失敗</h4>
                    <p>錯誤: ${error.message}</p>
                    <p>請確認後端服務器已啟動 (npm run dev)</p>
                `,
            false
          );
        }
      }

      async function testLogin() {
        try {
          const response = await fetch(`${API_BASE_URL}/auth/login`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              email: "demo@timetracker.pro",
              password: "demo123",
            }),
          });

          const data = await response.json();

          if (response.ok) {
            currentToken = data.data.accessToken;
            showResult(
              "authResult",
              `
                        <h4>✅ 登入成功</h4>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `
            );
          } else {
            throw new Error(data.message || "登入失敗");
          }
        } catch (error) {
          showResult(
            "authResult",
            `
                    <h4>❌ 登入失敗</h4>
                    <p>錯誤: ${error.message}</p>
                `,
            false
          );
        }
      }

      async function testRegister() {
        try {
          const response = await fetch(`${API_BASE_URL}/auth/register`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              email: `test${Date.now()}@timetracker.pro`,
              password: "test123",
              name: "測試用戶",
            }),
          });

          const data = await response.json();

          if (response.ok) {
            showResult(
              "authResult",
              `
                        <h4>✅ 註冊成功</h4>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `
            );
          } else {
            throw new Error(data.message || "註冊失敗");
          }
        } catch (error) {
          showResult(
            "authResult",
            `
                    <h4>❌ 註冊失敗</h4>
                    <p>錯誤: ${error.message}</p>
                `,
            false
          );
        }
      }

      async function testLogout() {
        if (!currentToken) {
          showResult(
            "authResult",
            `
                    <h4>⚠️ 請先登入</h4>
                    <p>需要先執行登入測試以獲取 Token</p>
                `,
            false
          );
          return;
        }

        try {
          const response = await fetch(`${API_BASE_URL}/auth/logout`, {
            method: "POST",
            headers: {
              Authorization: `Bearer ${currentToken}`,
            },
          });

          const data = await response.json();

          if (response.ok) {
            currentToken = null;
            showResult(
              "authResult",
              `
                        <h4>✅ 登出成功</h4>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `
            );
          } else {
            throw new Error(data.message || "登出失敗");
          }
        } catch (error) {
          showResult(
            "authResult",
            `
                    <h4>❌ 登出失敗</h4>
                    <p>錯誤: ${error.message}</p>
                `,
            false
          );
        }
      }

      async function testGetUserProfile() {
        if (!currentToken) {
          showResult(
            "userResult",
            `
                    <h4>⚠️ 請先登入</h4>
                    <p>需要先執行登入測試以獲取 Token</p>
                `,
            false
          );
          return;
        }

        try {
          const response = await fetch(`${API_BASE_URL}/users/profile`, {
            headers: {
              Authorization: `Bearer ${currentToken}`,
            },
          });

          const data = await response.json();

          if (response.ok) {
            showResult(
              "userResult",
              `
                        <h4>✅ 獲取用戶資料成功</h4>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `
            );
          } else {
            throw new Error(data.message || "獲取用戶資料失敗");
          }
        } catch (error) {
          showResult(
            "userResult",
            `
                    <h4>❌ 獲取用戶資料失敗</h4>
                    <p>錯誤: ${error.message}</p>
                `,
            false
          );
        }
      }

      async function testUpdateUserProfile() {
        if (!currentToken) {
          showResult(
            "userResult",
            `
                    <h4>⚠️ 請先登入</h4>
                    <p>需要先執行登入測試以獲取 Token</p>
                `,
            false
          );
          return;
        }

        try {
          const response = await fetch(`${API_BASE_URL}/users/profile`, {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${currentToken}`,
            },
            body: JSON.stringify({
              name: "更新後的用戶名稱",
            }),
          });

          const data = await response.json();

          if (response.ok) {
            showResult(
              "userResult",
              `
                        <h4>✅ 更新用戶資料成功</h4>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `
            );
          } else {
            throw new Error(data.message || "更新用戶資料失敗");
          }
        } catch (error) {
          showResult(
            "userResult",
            `
                    <h4>❌ 更新用戶資料失敗</h4>
                    <p>錯誤: ${error.message}</p>
                `,
            false
          );
        }
      }

      async function testGetProjects() {
        if (!currentToken) {
          showResult(
            "projectResult",
            `
                    <h4>⚠️ 請先登入</h4>
                    <p>需要先執行登入測試以獲取 Token</p>
                `,
            false
          );
          return;
        }

        try {
          const response = await fetch(`${API_BASE_URL}/projects`, {
            headers: {
              Authorization: `Bearer ${currentToken}`,
            },
          });

          const data = await response.json();

          if (response.ok) {
            showResult(
              "projectResult",
              `
                        <h4>✅ 獲取專案列表成功</h4>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `
            );
          } else {
            throw new Error(data.message || "獲取專案列表失敗");
          }
        } catch (error) {
          showResult(
            "projectResult",
            `
                    <h4>❌ 獲取專案列表失敗</h4>
                    <p>錯誤: ${error.message}</p>
                `,
            false
          );
        }
      }

      async function testCreateProject() {
        if (!currentToken) {
          showResult(
            "projectResult",
            `
                    <h4>⚠️ 請先登入</h4>
                    <p>需要先執行登入測試以獲取 Token</p>
                `,
            false
          );
          return;
        }

        try {
          const response = await fetch(`${API_BASE_URL}/projects`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${currentToken}`,
            },
            body: JSON.stringify({
              name: `測試專案 ${Date.now()}`,
              description: "API 測試建立的專案",
              hourlyRate: 1000,
              color: "#2563eb",
            }),
          });

          const data = await response.json();

          if (response.ok) {
            showResult(
              "projectResult",
              `
                        <h4>✅ 建立專案成功</h4>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `
            );
          } else {
            throw new Error(data.message || "建立專案失敗");
          }
        } catch (error) {
          showResult(
            "projectResult",
            `
                    <h4>❌ 建立專案失敗</h4>
                    <p>錯誤: ${error.message}</p>
                `,
            false
          );
        }
      }

      async function testTimeEntries() {
        if (!currentToken) {
          showResult(
            "timeResult",
            `
                    <h4>⚠️ 請先登入</h4>
                    <p>需要先執行登入測試以獲取 Token</p>
                `,
            false
          );
          return;
        }

        try {
          const response = await fetch(`${API_BASE_URL}/time-entries`, {
            headers: {
              Authorization: `Bearer ${currentToken}`,
            },
          });

          const data = await response.json();

          if (response.ok) {
            showResult(
              "timeResult",
              `
                        <h4>✅ 獲取時間記錄成功</h4>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `
            );
          } else {
            throw new Error(data.message || "獲取時間記錄失敗");
          }
        } catch (error) {
          showResult(
            "timeResult",
            `
                    <h4>❌ 獲取時間記錄失敗</h4>
                    <p>錯誤: ${error.message}</p>
                `,
            false
          );
        }
      }

      async function testCreateTimeEntry() {
        if (!currentToken) {
          showResult(
            "timeResult",
            `
                    <h4>⚠️ 請先登入</h4>
                    <p>需要先執行登入測試以獲取 Token</p>
                `,
            false
          );
          return;
        }

        try {
          // 首先獲取專案列表，找到第一個專案
          const projectsResponse = await fetch(`${API_BASE_URL}/projects`, {
            headers: {
              Authorization: `Bearer ${currentToken}`,
            },
          });

          const projectsData = await projectsResponse.json();

          if (
            !projectsResponse.ok ||
            !projectsData.success ||
            !projectsData.data.projects.length
          ) {
            throw new Error("沒有可用的專案，請先建立專案");
          }

          const projectId = projectsData.data.projects[0].id;

          // 建立時間記錄
          const response = await fetch(`${API_BASE_URL}/time-entries`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${currentToken}`,
            },
            body: JSON.stringify({
              projectId: projectId,
              description: "API 測試建立的時間記錄",
              startTime: new Date().toISOString(),
              endTime: new Date(Date.now() + 3600000).toISOString(),
              duration: 3600,
            }),
          });

          const data = await response.json();

          if (response.ok) {
            showResult(
              "timeResult",
              `
                        <h4>✅ 建立時間記錄成功</h4>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `
            );
          } else {
            throw new Error(data.message || "建立時間記錄失敗");
          }
        } catch (error) {
          showResult(
            "timeResult",
            `
                    <h4>❌ 建立時間記錄失敗</h4>
                    <p>錯誤: ${error.message}</p>
                `,
            false
          );
        }
      }

      // 頁面載入時檢查服務器狀態
      window.addEventListener("load", checkServerStatus);

      // 完整測試流程
      async function runFullTest() {
        const steps = [];

        try {
          showResult("fullTestResult", "<h4>🚀 開始執行完整測試流程...</h4>");

          // 步驟 1: 檢查服務器
          steps.push("1. 檢查服務器狀態");
          await checkServerStatus();

          // 步驟 2: 登入
          steps.push("2. 演示帳號登入");
          await testLogin();

          if (!currentToken) {
            throw new Error("登入失敗，無法繼續測試");
          }

          // 步驟 3: 建立專案
          steps.push("3. 建立測試專案");
          await testCreateProject();

          // 步驟 4: 建立時間記錄
          steps.push("4. 建立時間記錄");
          await testCreateTimeEntry();

          // 步驟 5: 獲取用戶資料
          steps.push("5. 獲取用戶資料");
          await testGetUserProfile();

          showResult(
            "fullTestResult",
            `
                    <h4>✅ 完整測試流程執行成功！</h4>
                    <p>所有 API 端點都正常運作：</p>
                    <ul>
                        ${steps.map((step) => `<li>${step} ✅</li>`).join("")}
                    </ul>
                    <p>🎉 TimeTracker Pro API 系統運作正常！</p>
                `
          );
        } catch (error) {
          showResult(
            "fullTestResult",
            `
                    <h4>❌ 測試流程中斷</h4>
                    <p>錯誤步驟: ${steps[steps.length - 1]}</p>
                    <p>錯誤訊息: ${error.message}</p>
                    <p>已完成步驟:</p>
                    <ul>
                        ${steps
                          .slice(0, -1)
                          .map((step) => `<li>${step} ✅</li>`)
                          .join("")}
                        <li>${steps[steps.length - 1]} ❌</li>
                    </ul>
                `,
            false
          );
        }
      }
    </script>
  </body>
</html>
